<!DOCTYPE html>
{% load static %}
<html>
<head>
    <meta charset="UTF-8">
    <title>{% block title %}MailFlow{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-image: url("{% static 'images/img.jpg' %}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>

<body>

<div class="container mt-4 p-4 rounded"
     style="background-color: rgba(255,255,255,0.9);">

    <nav class="mb-4 d-flex justify-content-center gap-3">
        <a href="/clients" class="btn btn-outline-primary">Клиенты</a>
        <a href="/messages" class="btn btn-outline-primary">Сообщения</a>
        <a href="/mailings" class="btn btn-outline-primary">Рассылки</a>
    </nav>
    {% if messages %}
    <div class="container mb-3">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    </div>
    {% endif %}
    {% block content %}
    {% endblock %}

</div>

</body>
</html>

{% extends "base.html" %}

{% block title %}Сообщение{% endblock %}

{% block content %}

<div class="card">
    <div class="card-header">
        {% if object %}
            Редактирование сообщения
        {% else %}
            Создание сообщения
        {% endif %}
    </div>

    <div class="card-body">
        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-success">
                Сохранить
            </button>

            <a href="{% url 'mail_messages:message_list' %}"
               class="btn btn-secondary">
                Назад
            </a>
        </form>
    </div>
</div>

{% endblock %}

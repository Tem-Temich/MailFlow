{% extends "base.html" %}

{% block title %}Удаление рассылки{% endblock %}

{% block content %}

<div class="card">
    <div class="card-header">
        Удаление рассылки
    </div>

    <div class="card-body">
        <p>Вы уверены, что хотите удалить рассылку #{{ mailing.pk }}?</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">
                Удалить
            </button>

            <a href="{% url 'mailings:mailing_list' %}" class="btn btn-secondary">
                Отмена
            </a>
        </form>
    </div>
</div>

{% endblock %}

{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}

<h2 class="mb-3">Регистрация</h2>

<div class="card">
    <div class="card-body">

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-success">
                Зарегистрироваться
            </button>

            <a href="{% url 'login' %}" class="btn btn-secondary">
                Уже есть аккаунт?
            </a>

        </form>

    </div>
</div>

{% endblock %}

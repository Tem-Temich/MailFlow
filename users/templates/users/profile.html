{% extends "base.html" %}

{% block title %}Профиль{% endblock %}

{% block content %}

<h2 class="mb-3">Мой профиль</h2>

<div class="card">
    <div class="card-body">

        <p><strong>Email:</strong> {{ user.email }}</p>
        <p><strong>Телефон:</strong> {{ user.phone }}</p>
        <p><strong>Страна:</strong> {{ user.country }}</p>

        {% if user.avatar %}
            <img src="{{ user.avatar.url }}" width="150" class="img-thumbnail">
        {% endif %}

        <br><br>

        <a href="{% url 'users:profile_edit' %}" class="btn btn-warning">
            Редактировать профиль
        </a>

    </div>
</div>

{% endblock %}

{% extends "base.html" %}

{% block title %}Редактирование клиента{% endblock %}

{% block content %}

<div class="card">
    <div class="card-header">
        Редактирование клиента
    </div>

    <div class="card-body">
        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-success">
                Сохранить изменения
            </button>

            <a href="{% url 'clients:client_detail' object.pk %}" 
               class="btn btn-secondary">
                Назад
            </a>
        </form>
    </div>
</div>

{% endblock %}
